<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f1f4f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121712" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{{ '/assets/img/logo.svg' | relative_url }}" type="image/svg+xml">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="preload" href="{{ '/assets/fonts/lexend-700.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="app-mark">{% include mark.svg %}</span>
        <span>The Pacer</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}#features"{% if page.url == '/' %} class="here"{% endif %}>Features</a>
        <a href="{{ '/manual/' | relative_url }}"{% if page.url contains '/manual/' %} class="here"{% endif %}>Manual</a>      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>© {{ site.time | date: '%Y' }} The Pacer</span>
      <nav aria-label="Legal">
        <a href="{{ '/privacy/' | relative_url }}">Privacy policy</a>
        <a href="{{ '/impressum/' | relative_url }}">Impressum</a>
      </nav>
    </div>
  </footer>
</body>
</html>
